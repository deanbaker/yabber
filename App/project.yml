name: Yabber
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
targets:
  Yabber:
    type: application
    platform: iOS
    sources: [Yabber, Shared]
    dependencies:
      - package: FluidAudio
      - target: YabberKeyboard
        embed: true
    entitlements:
      path: Yabber/Yabber.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yabber-app.yabber]
    info:
      path: Yabber/Info.plist
      properties:
        CFBundleDisplayName: Yabber
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Yabber listens while you dictate from its keyboard. Audio never leaves the phone.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [yabber]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YB_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  YabberKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    entitlements:
      path: Keyboard/YabberKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.yabber-app.yabber]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Yabber
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(YB_BUNDLE_ID).keyboard
